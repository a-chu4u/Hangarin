{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">

    <title>{% block title %}Hangarin{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/atlantis.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/fonts.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/demo.css' %}">
</head>

<body data-background-color="dark2">

<div class="wrapper">

    <div class="main-header">

        <div class="main-header-logo">
            <div class="logo-header" data-background-color="dark2">

                <a href="{% url 'home' %}" class="logo d-flex align-items-center">

                    <img src="{% static 'img/cat.jpg' %}"
                         alt="Logo"
                         class="mr-2"
                         style="
                            width: 35px;
                            height: 35px;
                            border-radius: 50%;
                            object-fit: cover;
                         ">

                    <span class="text-white h5 mb-0">
                        Achuuuu
                    </span>

                </a>

                <div class="nav-toggle">

                    <button class="btn btn-toggle toggle-sidebar">
                        <i class="icon-menu"></i>
                    </button>

                </div>

                <button class="topbar-toggler more">
                    <i class="icon-options-vertical"></i>
                </button>

            </div>
        </div>

        <nav class="navbar navbar-header navbar-header-transparent navbar-expand-lg border-bottom">

            <div class="container-fluid">

                <ul class="navbar-nav topbar-nav ml-md-auto align-items-center">

                    <li class="nav-item">

                        <span class="nav-link text-white">
                            {{ request.user.username }}
                        </span>

                    </li>

                </ul>

            </div>

        </nav>

    </div>


    <div class="sidebar" data-background-color="dark2">

        <div class="sidebar-logo">


        </div>

        <div class="sidebar-wrapper scrollbar scrollbar-inner">

            <div class="sidebar-content">

                <ul class="nav nav-primary">

                    <li class="nav-item">

                        <a href="{% url 'home' %}">

                            <i class="fas fa-home"></i>

                            <p>
                                Dashboard
                            </p>

                        </a>

                    </li>

                    <li class="nav-item">

                        <a href="{% url 'task-list' %}">

                            <i class="fas fa-tasks"></i>

                            <p>
                                Tasks
                            </p>

                        </a>

                    </li>

                    <li class="nav-item">

                        <a href="{% url 'subtask-list' %}">

                            <i class="fas fa-list-ul"></i>

                            <p>
                                SubTasks
                            </p>

                        </a>

                    </li>


                    <li class="nav-item">

                        <a href="{% url 'category-list' %}">

                            <i class="fas fa-folder"></i>

                            <p>
                                Categories
                            </p>

                        </a>

                    </li>

                    <li class="nav-item">

                        <a href="{% url 'priority-list' %}">

                            <i class="fas fa-flag"></i>

                            <p>
                                Priorities
                            </p>

                        </a>

                    </li>


                    <!-- Notes -->
                    <li class="nav-item">

                        <a href="{% url 'note-list' %}">

                            <i class="fas fa-sticky-note"></i>

                            <p>
                                Notes
                            </p>

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </div>

    <div class="main-panel">

        {% block content %}
        {% endblock %}

    </div>

</div>


<script src="{% static 'js/core/jquery.3.2.1.min.js' %}"></script>

<script src="{% static 'js/core/popper.min.js' %}"></script>

<script src="{% static 'js/core/bootstrap.min.js' %}"></script>

<script src="{% static 'js/atlantis.min.js' %}"></script>

</body>

</html>
