{% load static %}
{% load pwa %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, shrink-to-fit=no">

    <title>{% block title %}Hangarin{% endblock %}</title>

    {% progressive_web_app_meta %}

    <link rel="stylesheet"
          href="{% static 'css/bootstrap.min.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/atlantis.min.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/fonts.min.css' %}">


    <style>

        :root {

            --mint-mist: #E4F7EE;
            --pale-aqua: #C7E9ED;
            --periwinkle-blue: #B2CAED;

            --text-color: #40566F;
            --heading-color: #334B63;

            --hover-blue: #91B3E2;
            --border-color: #C8D9E2;

        }


        /* =========================
           GENERAL
        ========================= */

        html,
        body {

            background-color: var(--mint-mist) !important;
            color: var(--text-color) !important;

        }


        .wrapper,
        .main-panel,
        .content {

            background-color: var(--mint-mist) !important;
            color: var(--text-color) !important;

        }


        /* =========================
           TOP BAR
        ========================= */

        .main-header,
        .main-header .navbar,
        .navbar-header,
        .navbar-header-transparent,
        .logo-header {

            background-color: var(--periwinkle-blue) !important;

        }


        .main-header {

            border-bottom: 1px solid var(--border-color) !important;

        }


        .logo-header .logo,
        .logo-header .logo span,
        .logo-header .nav-toggle i,
        .logo-header .topbar-toggler i {

            color: var(--heading-color) !important;

        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar,
        .sidebar-wrapper,
        .sidebar-content {

            background-color: var(--periwinkle-blue) !important;

        }


        .sidebar .nav-primary .nav-item > a,
        .sidebar .nav-primary .nav-item > a p,
        .sidebar .nav-primary .nav-item > a i {

            color: var(--heading-color) !important;

        }


        .sidebar .nav-primary .nav-item > a:hover {

            background-color: var(--hover-blue) !important;
            border-radius: 6px;

        }


        .sidebar .nav-primary .nav-item.active > a {

            background-color: var(--periwinkle-blue) !important;
            border-radius: 6px;

        }


        .sidebar .nav-primary .nav-item.active > a,
        .sidebar .nav-primary .nav-item.active > a p,
        .sidebar .nav-primary .nav-item.active > a i {

            color: var(--heading-color) !important;

        }


        .nav-link.text-white {

            background-color: var(--periwinkle-blue) !important;
            color: var(--heading-color) !important;
            border-radius: 6px;

        }


        /* =========================
           CARDS
        ========================= */

        .card {

            background-color: #FFFFFF !important;
            color: var(--text-color) !important;
            border: none;
            border-radius: 8px;

        }


        .card-header {

            background-color: #FFFFFF !important;
            color: var(--heading-color) !important;
            border-bottom: 1px solid var(--border-color);

        }


        .card-title {

            color: var(--heading-color) !important;

        }


        .card-body {

            background-color: #FFFFFF !important;
            color: var(--text-color) !important;

        }


        /* =========================
           DASHBOARD TEXT
        ========================= */

        .card-body h1,
        .card-body h2,
        .card-body h3,
        .card-body h4,
        .card-body h5,
        .card-body h6 {

            color: var(--heading-color) !important;

        }


        .card-body p,
        .card-body span,
        .card-body small {

            color: var(--text-color) !important;

        }


        .text-white {

            color: var(--heading-color) !important;

        }


        .card-body h2 {

            color: var(--heading-color) !important;
            font-weight: 600 !important;

        }


        .card-body h3 {

            color: var(--heading-color) !important;
            font-weight: 600 !important;

        }


        .card-body h4 {

            color: var(--heading-color) !important;
            font-weight: 500 !important;

        }


        /* =========================
           TABLES
        ========================= */

        .table {

            color: var(--text-color) !important;
            background-color: #FFFFFF;

        }


        .table thead th {

            background-color: var(--periwinkle-blue) !important;
            color: var(--heading-color) !important;
            border-color: var(--border-color) !important;

        }


        .table tbody tr {

            background-color: #FFFFFF !important;

        }


        .table-striped tbody tr:nth-of-type(odd) {

            background-color: var(--pale-aqua) !important;

        }


        .table tbody td {

            color: var(--text-color) !important;
            border-color: var(--border-color) !important;

        }


        /* =========================
           BUTTONS
        ========================= */

        .btn-primary,
        .btn-success {

            background-color: var(--periwinkle-blue) !important;
            border-color: var(--periwinkle-blue) !important;
            color: var(--heading-color) !important;
            box-shadow: none !important;

        }


        .btn-primary:hover,
        .btn-success:hover {

            background-color: var(--hover-blue) !important;
            border-color: var(--hover-blue) !important;
            color: var(--heading-color) !important;

        }


        .btn-secondary {

            background-color: var(--pale-aqua) !important;
            border-color: var(--pale-aqua) !important;
            color: var(--heading-color) !important;

        }


        .btn-secondary:hover {

            background-color: #B5DDE2 !important;
            border-color: #B5DDE2 !important;

        }


        /* =========================
           FORMS
        ========================= */

        .form-control {

            background-color: #FFFFFF !important;
            color: var(--text-color) !important;
            border-color: var(--periwinkle-blue) !important;

        }


        .form-control:focus {

            border-color: var(--hover-blue) !important;

            box-shadow: 0 0 0 0.2rem
                rgba(178, 202, 237, 0.4) !important;

        }


        .form-control::placeholder {

            color: #718096 !important;

        }


        label {

            color: var(--heading-color) !important;

        }


        /* =========================
           HEADINGS
        ========================= */

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {

            color: var(--heading-color) !important;

        }


        /* =========================
           LINKS
        ========================= */

        a {

            color: #4A6F9B;

        }


        a:hover {

            color: #315D91;

        }


        /* =========================
           PAGINATION
        ========================= */

        .pagination .page-item .page-link {

            background-color: #FFFFFF;
            color: var(--text-color);
            border-color: var(--periwinkle-blue);

        }


        .pagination .page-item.active .page-link {

            background-color: var(--periwinkle-blue);
            border-color: var(--periwinkle-blue);
            color: var(--heading-color);

        }


        .pagination .page-item .page-link:hover {

            background-color: var(--pale-aqua);
            color: var(--heading-color);

        }


        /* =========================
           BADGES
        ========================= */

        .badge-primary,
        .badge-success {

            background-color: var(--periwinkle-blue) !important;
            color: var(--heading-color) !important;

        }


        /* =========================
           TABLE LINKS
        ========================= */

        .table td a {

            font-weight: 500;

        }


        /* =================================================
           MOBILE MENU
        ================================================= */

        #mobileMenuButton {

            display: none;

        }


        @media (max-width: 991px) {

            #mobileMenuButton {

                display: flex !important;

                position: fixed !important;

                top: 10px !important;

                left: 12px !important;

                width: 42px !important;

                height: 42px !important;

                align-items: center !important;

                justify-content: center !important;

                background-color: #B2CAED !important;

                color: #334B63 !important;

                border: none !important;

                border-radius: 6px !important;

                font-size: 25px !important;

                line-height: 1 !important;

                z-index: 10001 !important;

                padding: 0 !important;

                box-shadow: none !important;

            }


            #mobileMenuButton:active {

                background-color: #91B3E2 !important;

            }


            /* Mobile sidebar */

            .sidebar {

                position: fixed !important;

                top: 0 !important;

                left: 0 !important;

                bottom: 0 !important;

                width: 250px !important;

                height: 100vh !important;

                z-index: 10000 !important;

                transform: translateX(-100%) !important;

                transition: transform 0.25s ease-in-out !important;

                background-color: #B2CAED !important;

                box-shadow: 4px 0 15px rgba(0, 0, 0, 0.15) !important;

            }


            /* Open sidebar */

            body.mobile-sidebar-open .sidebar {

                transform: translateX(0) !important;

            }


            .sidebar-wrapper {

                height: 100% !important;

                overflow-y: auto !important;

            }


            .sidebar-content {

                min-height: 100% !important;

            }


            .sidebar .nav {

                display: block !important;

                padding-top: 60px !important;

            }


            .sidebar .nav-item {

                display: block !important;

                width: 100% !important;

            }


            .sidebar .nav-item a {

                display: flex !important;

                align-items: center !important;

                width: 100% !important;

                padding: 14px 20px !important;

            }


            .sidebar .nav-item a i {

                width: 25px !important;

                margin-right: 10px !important;

            }


            .sidebar .nav-item a p {

                display: block !important;

                margin: 0 !important;

            }


            /* Overlay */

            body.mobile-sidebar-open::after {

                content: "";

                position: fixed;

                top: 0;

                left: 0;

                right: 0;

                bottom: 0;

                background: rgba(0, 0, 0, 0.35);

                z-index: 9999 !important;

            }


            /* Keep sidebar above overlay */

            body.mobile-sidebar-open .sidebar {

                z-index: 10000 !important;

            }


            .main-panel {

                width: 100% !important;

                margin-left: 0 !important;

            }


            /* Hide Atlantis mobile toggle */

            .nav-toggle {

                display: none !important;

            }

        }


        @media (min-width: 992px) {

            #mobileMenuButton {

                display: none !important;

            }

        }

    </style>

</head>


<body data-background-color="light">


<!-- =========================
     CUSTOM MOBILE MENU BUTTON
========================= -->

<button id="mobileMenuButton"
        type="button"
        aria-label="Open menu">

    ☰

</button>


<div class="wrapper">


    <!-- =========================
         TOP HEADER
    ========================= -->

    <div class="main-header">


        <div class="main-header-logo">


            <div class="logo-header"
                 data-background-color="light">


                <a href="{% url 'home' %}"
                   class="logo d-flex align-items-center">


                    <img src="{% static 'img/cat.jpg' %}"
                         alt="Logo"
                         class="mr-2"
                         style="
                            width: 35px;
                            height: 35px;
                            border-radius: 50%;
                            object-fit: cover;
                         ">


                    <span class="h5 mb-0"
                          style="color: #334B63;">

                        Achuuuu

                    </span>


                </a>


                <div class="nav-toggle">

                    <button type="button"
                            class="btn btn-toggle toggle-sidebar">

                        <i class="icon-menu"></i>

                    </button>

                </div>


                <button type="button"
                        class="topbar-toggler more">

                    <i class="icon-options-vertical"></i>

                </button>


            </div>


        </div>


        <nav class="navbar navbar-header navbar-header-transparent navbar-expand-lg border-bottom">


            <div class="container-fluid">


                <ul class="navbar-nav topbar-nav ml-md-auto align-items-center">


                    <li class="nav-item">


                        <span class="nav-link"
                              style="
                                background-color: #B2CAED;
                                color: #334B63;
                                border-radius: 6px;
                              ">

                            {{ request.user.username }}

                        </span>


                    </li>


                </ul>


            </div>


        </nav>


    </div>


    <!-- =========================
         SIDEBAR
    ========================= -->

    <div class="sidebar"
         data-background-color="light">


        <div class="sidebar-logo">
        </div>


        <div class="sidebar-wrapper scrollbar scrollbar-inner">


            <div class="sidebar-content">


                <ul class="nav nav-primary">


                    <li class="nav-item">

                        <a href="{% url 'home' %}">

                            <i class="fas fa-home"></i>

                            <p>Dashboard</p>

                        </a>

                    </li>


                    <li class="nav-item">

                        <a href="{% url 'task-list' %}">

                            <i class="fas fa-tasks"></i>

                            <p>Tasks</p>

                        </a>

                    </li>


                    <li class="nav-item">

                        <a href="{% url 'subtask-list' %}">

                            <i class="fas fa-list-ul"></i>

                            <p>SubTasks</p>

                        </a>

                    </li>


                    <li class="nav-item">

                        <a href="{% url 'note-list' %}">

                            <i class="fas fa-sticky-note"></i>

                            <p>Notes</p>

                        </a>

                    </li>


                    <li class="nav-item">

                        <a href="{% url 'category-list' %}">

                            <i class="fas fa-folder"></i>

                            <p>Categories</p>

                        </a>

                    </li>


                    <li class="nav-item">

                        <a href="{% url 'priority-list' %}">

                            <i class="fas fa-flag"></i>

                            <p>Priorities</p>

                        </a>

                    </li>


                    <li class="nav-item">

                        <a href="{% url 'account_logout' %}">

                            <i class="fas fa-sign-out-alt"></i>

                            <p>Logout</p>

                        </a>

                    </li>


                </ul>


            </div>

        </div>

    </div>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <div class="main-panel">

        {% block content %}

        {% endblock %}

    </div>


</div>


<!-- =========================
     SCRIPTS
========================= -->

<script src="{% static 'js/core/jquery.3.2.1.min.js' %}"></script>

<script src="{% static 'js/core/popper.min.js' %}"></script>

<script src="{% static 'js/core/bootstrap.min.js' %}"></script>

<script src="{% static 'js/atlantis.min.js' %}"></script>


<!-- =========================
     MOBILE SIDEBAR SCRIPT
========================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const menuButton =
        document.getElementById("mobileMenuButton");

    const sidebar =
        document.querySelector(".sidebar");


    if (!menuButton || !sidebar) {

        return;

    }


    /* Open / close menu */

    menuButton.addEventListener("click", function (event) {

        event.preventDefault();

        event.stopPropagation();

        document.body.classList.toggle(
            "mobile-sidebar-open"
        );

    });


    /* Close menu when clicking outside */

    document.addEventListener("click", function (event) {

        if (window.innerWidth <= 991) {

            if (
                document.body.classList.contains(
                    "mobile-sidebar-open"
                ) &&
                !sidebar.contains(event.target) &&
                !menuButton.contains(event.target)
            ) {

                document.body.classList.remove(
                    "mobile-sidebar-open"
                );

            }

        }

    });


    /* Close menu after selecting a page */

    const sidebarLinks =
        document.querySelectorAll(
            ".sidebar .nav-item a"
        );


    sidebarLinks.forEach(function (link) {

        link.addEventListener("click", function () {

            if (window.innerWidth <= 991) {

                document.body.classList.remove(
                    "mobile-sidebar-open"
                );

            }

        });

    });


    /* Reset when switching to desktop */

    window.addEventListener("resize", function () {

        if (window.innerWidth > 991) {

            document.body.classList.remove(
                "mobile-sidebar-open"
            );

        }

    });

});

</script>


</body>

</html>
