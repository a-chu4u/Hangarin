{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="content">
    <div class="container-fluid">

        <div class="row">
            <div class="col-md-12">

                <div class="card">

                    <div class="card-header">
                        <div class="card-title">List of Priorities</div>
                    </div>

                    <br />

                    <div class="col-md-12 row">

                        <!-- Search -->
                        <div class="col-md-6">
                            <form method="get" action="{% url 'priority-list' %}">
                                <div class="input-group">

                                    <input type="text"
                                           name="q"
                                           class="form-control"
                                           placeholder="Search ..."
                                           value="{{ request.GET.q }}">

                                    <div class="input-group-append">
                                        <button type="submit" class="btn btn-primary">
                                            Search
                                        </button>
                                    </div>

                                </div>
                            </form>
                        </div>

                        <!-- Add Priority -->
                        <div class="col-md-6">
                            <div class="pull-right">
                                <a href="{% url 'priority-add' %}"
                                   class="btn btn-success btn-rounded">
                                    Add Priority
                                </a>
                            </div>
                        </div>

                    </div>

                    <div class="card-body">

                        <table class="table table-striped mt-3">

                            <thead>
                                <tr>
                                    <th scope="col">Name</th>
                                    <th scope="col">Action</th>
                                </tr>
                            </thead>

                            <tbody>

                                {% for object in priorities %}

                                <tr>
                                    <td>{{ object.name }}</td>

                                    <td>
                                        <a href="{% url 'priority-update' object.id %}">
                                            Edit
                                        </a>

                                        <a href="{% url 'priority-delete' object.id %}"
                                           class="text-danger">
                                            Delete
                                        </a>
                                    </td>
                                </tr>

                                {% empty %}

                                <tr>
                                    <td colspan="2" style="text-align: center">
                                        <p class="text-sm font-weight-bold mb-0">
                                            No Records Found
                                        </p>
                                    </td>
                                </tr>

                                {% endfor %}

                            </tbody>

                        </table>

                        {% include 'includes/pagination.html' %}

                    </div>

                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
